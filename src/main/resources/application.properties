spring.application.name=erp

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/ERP

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/erp?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:erp}
spring.datasource.password=${DB_PASSWORD:erp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:/mapper/*.xml

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
erp.upload-dir=${ERP_UPLOAD_DIR:./uploads}

erp.ai.base-url=${ERP_AI_BASE_URL:http://localhost:11434}
erp.ai.model=${ERP_AI_MODEL:qwen3:4b}
erp.ai.think=${ERP_AI_THINK:false}
erp.ai.timeout-seconds=${ERP_AI_TIMEOUT_SECONDS:60}
